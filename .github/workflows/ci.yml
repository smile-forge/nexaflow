# Continuous integration: build, unit-test, and verify the installer payload on every push/PR to main.
#
# This is a pass/fail GATE, not an artifact factory. It proves the tree builds, the unit tests pass, and the
# installer payload is complete (the check that would have caught 1.2's missing video engine before release).
# It deliberately does NOT build the release bundle or publish anything: the bundle pulls in the ~60 MB .NET
# runtime payload (no sense on every push), and releasing stays a manual gate you own — build the bundle,
# rename it for the Updatum in-app updater, do a clean-install check, then upload. The MSI built here is just
# a byproduct of running the guards and is thrown away.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & verify payload
    runs-on: windows-latest   # WPF / net10.0-windows + WiX MSI need Windows

    steps:
      # submodules: the build ProjectReferences third-party source under external/ (DiscUtils, AngouriMath,
      # tree-sitter — public smile-forge forks), so without this the restore/build can't resolve them.
      # See docs/externals.md.
      # persist-credentials: false, because nothing here pushes and the submodules are public. Left on,
      # checkout writes the token into .git/config and adds a post-job step, after the tests, to take it out.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The runner is a fresh VM every time, so nothing survives on the machine — but the cache does not live
      # there. GitHub keeps the archive in its repo-scoped cache service and it is unpacked onto the new VM,
      # which turns Restore's hundreds of nuget.org round-trips into one download. Restore is resolution AND
      # download; this removes only the second, so it takes back part of the step, not all.
      #
      # The key is what decides which packages are wanted, and nothing else: every PackageReference,
      # PackageVersion and PackageDownload line and every pinned SDK across the tree (submodules included),
      # plus the feed config and global.json. An edit to a project that does not touch its packages keeps
      # the key. On a miss, restore-keys still recovers the newest earlier archive and restore fetches only
      # the delta, so a version bump costs the bump, not the whole graph.
      - name: Key the NuGet cache
        id: nuget-key
        shell: pwsh
        run: |
          $lines = Get-ChildItem -Recurse -File -Include *.csproj, *.fsproj, *.wixproj, *.props, *.targets |
            Where-Object FullName -notmatch '[\\/](bin|obj)[\\/]' |
            Select-String -Pattern '<Package(Reference|Version|Download)\b[^>]*>|Sdk="[^"]+/[^"]+"' -AllMatches |
            ForEach-Object { $_.Matches.Value -replace '\s+', ' ' } |
            Sort-Object -Unique
          $lines += Get-Content NuGet.config, global.json -ErrorAction SilentlyContinue
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($lines -join "`n")))
          "key=${{ runner.os }}-nuget-$hash" >> $env:GITHUB_OUTPUT

      # Restore only. The combined actions/cache also adds a post-job step that, whenever the key missed,
      # compresses all of ~/.nuget/packages (over 2 GB) and uploads it — after the tests, on every PR that
      # changed a package. A cache a PR saves is readable only by that PR's own later runs, and every one
      # pushes others out of the repo's 10 GB, main's included. So every run reads, and only main writes.
      - name: Restore cached NuGet packages
        id: nuget-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-key.outputs.key }}
          restore-keys: ${{ runner.os }}-nuget-

      # Restores nuget.org + the VideoLAN preview feed (libVLC) per NuGet.config. The installer lives in its
      # own NexaflowSetup.slnx (kept out of the app solution), so restore both to cover the WiX projects too.
      - name: Restore
        run: |
          dotnet restore Nexaflow.slnx
          dotnet restore NexaflowSetup.slnx

      # Main writes the cache, once per set of packages, as soon as Restore has filled the folder: not at the
      # end of the job, so a failing test does not throw away a good cache and nothing is compressed while the
      # build waits. A miss starts from the newest earlier archive (restore-keys), so before it is saved the
      # folder is cut back to exactly what this restore used — the packages every project's assets file names,
      # and the SDKs the projects pin, which no assets file lists — or every version ever bumped past would
      # ride along in the archive for ever.
      - name: Keep only the packages this restore used
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $used = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($assets in Get-ChildItem -Recurse -File -Filter project.assets.json) {
            foreach ($library in (Get-Content $assets.FullName -Raw | ConvertFrom-Json).libraries.PSObject.Properties) {
              if ($library.Value.type -eq 'package') { [void]$used.Add($library.Name) }
            }
          }
          Get-ChildItem -Recurse -File -Include *.csproj, *.wixproj, *.props, *.targets |
            Select-String -Pattern 'Sdk="([^"/]+)/([^"]+)"' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { [void]$used.Add("$($_.Groups[1].Value)/$($_.Groups[2].Value)") }
          $root = Join-Path $HOME '.nuget/packages'
          foreach ($package in Get-ChildItem $root -Directory) {
            foreach ($version in Get-ChildItem $package.FullName -Directory) {
              if (-not $used.Contains("$($package.Name)/$($version.Name)")) { Remove-Item $version.FullName -Recurse -Force }
            }
            if (-not (Get-ChildItem $package.FullName)) { Remove-Item $package.FullName -Force }
          }

      - name: Save NuGet packages for later runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-key.outputs.key }}

      # The point of this step is the payload-completeness GUARDS, not the MSI. Building the installer builds
      # Core -> every feature/provider/shared project, then asserts every provider DLL, every feature DLL and
      # the libVLC native runtime made it into the payload. A DLL or native that fails to propagate fails here,
      # loudly — instead of silently shipping (the bug that broke video in 1.2). The MSI itself is discarded.
      - name: Verify installer payload is complete (Release, x64)
        run: dotnet build nexaflowSetup/nexaflowSetup.wixproj -c Release -p:Platform=x64 --no-restore

      # Build the WHOLE solution, not just the five projects whose tests run below. Naming projects meant the
      # other suites — Visuals, Components, Maths, the Viewers/WindowsOS/Architecture ones —
      # were never compiled here, so a break in any of them passed CI and only surfaced when somebody opened
      # the solution in Visual Studio. That is exactly how the ApprovalTests 6→7 bump reached main: it broke
      # Tests.Typesetting, which nothing in this workflow built. The five exes below still land in the same
      # bin/x64/Release/<tfm>/ paths, so the run step is unaffected.
      - name: Build the solution (Release)
        run: dotnet build Nexaflow.slnx -c Release --no-restore

      # Every suite the runner can honestly execute — which is all of them but the ones that need a machine
      # of their own. Naming five of them meant a break in Visuals, Components, Viewers, WindowsOS or Maths
      # passed CI and surfaced only in Visual Studio, the same class of gap the "build the whole solution"
      # step above was added to close.
      #
      # What is excluded, and why:
      #   • Nexaflow.Tests.UIJourneys — the only suite that launches the app and drives the real mouse. It
      #     takes the machine (UiTestGate holds a machine-wide semaphore), so it stays a run-it-yourself
      #     suite. It is not in the map at all; no filter would make it safe here.
      #   • TestCategory=Desktop — shows a real window and competes for focus, which is machine-wide. A
      #     runner can host one, but "passes unless something else took focus" is not a gate.
      #   • TestCategory=Interactive — calls a real Windows service and asserts against whatever that
      #     machine happens to have indexed. A coin toss on a fresh VM. See docs/testing.md.
      #
      # TestCategory=UI is NOT excluded any more, and that is the point of the split: since the journeys
      # moved into their own assembly, UI in the remaining suites means "constructs and renders WPF on an
      # STA thread, opens no window" — fast, parallel-safe, and previously never run here at all.
      #
      # Nexaflow.Tests.Features.Architecture reads tracked source, project files and baselines, so it gates
      # here like any other suite. The product tree it also checks is the gitignored .product/tree.json:
      # absent from a CI checkout, those guards return early and stay dev-time checks.
      #
      # The MSTest/MTP test exes take --filter directly. The TFM map is per-project because they genuinely
      # differ — Initiatives and Maths are plain net10.0 (WPF-free subjects), IO/Providers/AiHost/Visuals/Components
      # are net10.0-windows (no WinRT), the rest carry the Windows SDK TFM.
      #
      # tools/ci/Invoke-UnitTests.ps1 runs them. Each suite writes a TRX report, and every failed test in it is
      # re-run once by name: failed twice is an ::error titled with the test's name and fails the job; passed the
      # second time is a "Flaky test" ::warning and a line in flakes.json, and the job stays green. The runner has
      # 4 cores against a developer's 32, so a test that leans on real time fails here and nowhere else — the retry
      # keeps it off PRs that never touched it, and making it deterministic is the fix. See docs/testing.md.
      - name: Run unit tests
        shell: pwsh
        run: |
          $tests = [ordered]@{
            'Nexaflow.Tests.Core'              = 'net10.0-windows10.0.19041.0'
            'Nexaflow.Tests.Features'          = 'net10.0-windows10.0.19041.0'
            'Nexaflow.Tests.Features.Viewers'  = 'net10.0-windows10.0.19041.0'
            'Nexaflow.Tests.Features.WindowsOS' = 'net10.0-windows10.0.19041.0'
            'Nexaflow.Tests.Features.Architecture' = 'net10.0-windows10.0.19041.0'
            'Nexaflow.Tests.Visuals'           = 'net10.0-windows'
            'Nexaflow.Tests.Components'        = 'net10.0-windows'
            'Nexaflow.Tests.Initiatives'       = 'net10.0'
            'Nexaflow.Tests.Maths'             = 'net10.0'
            'Nexaflow.Tests.IO'                = 'net10.0-windows'
            'Nexaflow.Tests.Providers'         = 'net10.0-windows'
            'Nexaflow.Tests.AiHost'            = 'net10.0-windows'
          }
          ./tools/ci/Invoke-UnitTests.ps1 -Suites $tests -ResultsDirectory "$env:RUNNER_TEMP/test-results" `
            -Commit '${{ github.event.pull_request.head.sha || github.sha }}'

      # The TRX reports and flakes.json, kept whether the tests passed or failed; a flake's entry names the
      # test, its project, the commit and this run.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

