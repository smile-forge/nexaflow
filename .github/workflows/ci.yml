# Continuous integration: build, unit-test, and verify the installer payload on every push/PR to main.
#
# This is a pass/fail GATE, not an artifact factory. It proves the tree builds, the unit tests pass, and the
# installer payload is complete (the check that would have caught 1.2's missing video engine before release).
# It deliberately does NOT build the release bundle or publish anything: the bundle pulls in the ~60 MB .NET
# runtime payload (no sense on every push), and releasing stays a manual gate you own — build the bundle,
# rename it for the Updatum in-app updater, do a clean-install check, then upload. The MSI built here is just
# a byproduct of running the guards and is thrown away.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & verify payload
    runs-on: windows-latest   # WPF / net10.0-windows + WiX MSI need Windows

    steps:
      # submodules: the build ProjectReferences third-party source under external/ (DiscUtils, AngouriMath,
      # tree-sitter — public smile-forge forks), so without this the restore/build can't resolve them.
      # See docs/externals.md.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The runner is a fresh VM every time, so nothing survives on the machine — but the cache does not live
      # there. actions/cache keeps the archive in GitHub's own repo-scoped cache service and unpacks it onto
      # the new VM, which turns Restore's hundreds of nuget.org round-trips into one download. Restore is
      # resolution AND download; this removes only the second, so it takes back part of the step, not all.
      # The key is every file that can change which packages are wanted. On a miss, restore-keys still
      # recovers the newest earlier archive and restore fetches only the delta — so a version bump costs the
      # bump, not the whole graph. Caches written on main are readable from every PR branch (a PR's own are
      # not shared back), so main populates it and the PRs live off it.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/*.props', 'NuGet.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Restores nuget.org + the VideoLAN preview feed (libVLC) per NuGet.config. The installer lives in its
      # own NexaflowSetup.slnx (kept out of the app solution), so restore both to cover the WiX projects too.
      - name: Restore
        run: |
          dotnet restore Nexaflow.slnx
          dotnet restore NexaflowSetup.slnx

      # The point of this step is the payload-completeness GUARDS, not the MSI. Building the installer builds
      # Core -> every feature/provider/shared project, then asserts every provider DLL, every feature DLL and
      # the libVLC native runtime made it into the payload. A DLL or native that fails to propagate fails here,
      # loudly — instead of silently shipping (the bug that broke video in 1.2). The MSI itself is discarded.
      - name: Verify installer payload is complete (Release, x64)
        run: dotnet build nexaflowSetup/nexaflowSetup.wixproj -c Release -p:Platform=x64 --no-restore

      # Build the WHOLE solution, not just the five projects whose tests run below. Naming projects meant the
      # other suites — Typesetting (F#), Visuals, Components, Maths, the Viewers/WindowsOS/Architecture ones —
      # were never compiled here, so a break in any of them passed CI and only surfaced when somebody opened
      # the solution in Visual Studio. That is exactly how the ApprovalTests 6→7 bump reached main: it broke
      # Tests.Typesetting, which nothing in this workflow built. The five exes below still land in the same
      # bin/x64/Release/<tfm>/ paths, so the run step is unaffected.
      - name: Build the solution (Release)
        run: dotnet build Nexaflow.slnx -c Release --no-restore

      # Every suite the runner can honestly execute — which is all of them but the ones that need a machine
      # of their own. Naming five of them meant a break in Visuals, Components, Viewers, WindowsOS or Maths
      # passed CI and surfaced only in Visual Studio, the same class of gap the "build the whole solution"
      # step above was added to close.
      #
      # What is excluded, and why:
      #   • Nexaflow.Tests.UIJourneys — the only suite that launches the app and drives the real mouse. It
      #     takes the machine (UiTestGate holds a machine-wide semaphore), so it stays a run-it-yourself
      #     suite. It is not in the map at all; no filter would make it safe here.
      #   • TestCategory=Desktop — shows a real window and competes for focus, which is machine-wide. A
      #     runner can host one, but "passes unless something else took focus" is not a gate.
      #   • TestCategory=Interactive — calls a real Windows service and asserts against whatever that
      #     machine happens to have indexed. A coin toss on a fresh VM. See docs/testing.md.
      #
      # TestCategory=UI is NOT excluded any more, and that is the point of the split: since the journeys
      # moved into their own assembly, UI in the remaining suites means "constructs and renders WPF on an
      # STA thread, opens no window" — fast, parallel-safe, and previously never run here at all.
      #
      # Nexaflow.Tests.Features.Architecture is deliberately absent: its subjects are the product tree and
      # the graph, which are gitignored and so are not in a CI checkout.
      #
      # The MSTest/MTP test exes take --filter directly. The TFM map is per-project because they genuinely
      # differ — Initiatives and Maths are plain net10.0 (WPF-free subjects), IO/Providers/Visuals/Components
      # are net10.0-windows (no WinRT), the rest carry the Windows SDK TFM.
      - name: Run unit tests
        shell: pwsh
        run: |
          $tests = [ordered]@{
            'Nexaflow.Tests.Core'              = 'net10.0-windows10.0.19041.0'
            'Nexaflow.Tests.Features'          = 'net10.0-windows10.0.19041.0'
            'Nexaflow.Tests.Features.Viewers'  = 'net10.0-windows10.0.19041.0'
            'Nexaflow.Tests.Features.WindowsOS' = 'net10.0-windows10.0.19041.0'
            'Nexaflow.Tests.Visuals'           = 'net10.0-windows'
            'Nexaflow.Tests.Components'        = 'net10.0-windows'
            'Nexaflow.Tests.Initiatives'       = 'net10.0'
            'Nexaflow.Tests.Maths'             = 'net10.0'
            'Nexaflow.Tests.IO'                = 'net10.0-windows'
            'Nexaflow.Tests.Providers'         = 'net10.0-windows'
          }
          $failed = $false
          foreach ($proj in $tests.Keys) {
            $exe = "src/Nexaflow.Tests/$proj/bin/x64/Release/$($tests[$proj])/$proj.exe"
            Write-Host "::group::$proj"
            & $exe --filter 'TestCategory!=Desktop&TestCategory!=Interactive'
            if ($LASTEXITCODE -ne 0) { $failed = $true; Write-Host "::error::$proj failed (exit $LASTEXITCODE)" }
            Write-Host '::endgroup::'
          }
          if ($failed) { exit 1 }

      # The typesetting approvals are the one suite that is not an MSTest exe — F#/xunit, ingested with the
      # engine, and run through `dotnet test` from its own directory because global.json beside it pins the
      # runner. They are the oracle the LaTeX parser replacement is measured against — a precise record of what
      # the engine builds for each of 148 formulas — and nothing in this workflow ran them before.
      - name: Run typesetting approvals (F#/xunit)
        shell: pwsh
        working-directory: src/Nexaflow.Tests/Nexaflow.Tests.Typesetting
        run: dotnet test Nexaflow.Tests.Typesetting.fsproj -c Release --no-restore
